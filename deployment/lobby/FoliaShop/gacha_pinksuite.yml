
machines:
  pinksuite:
    name: "<light_purple>绯樱套装扭蛋机"
    description:
      - "<gray>花费 <yellow>300金币 <gray>抽取一次"
      - "<light_purple>有机会获得全套绯樱装备(集齐后会发生什么呢~)！"
      - "<light_purple>有机会获得全套玩偶！"
      - ""
      - "<light_purple>✦ 单抽: 300金币"
      - "<light_purple>✦ 10连抽: 3000金币"
      - "<light_purple>✦ 保底: 100抽"
      - "<light_purple>✦ 综合概率: 1.45%"
    icon: "pink_pack:scythe"
    icon-components:
      - "minecraft:enchantment_glint_override+true"
    cost: 300.0
    animation-duration: 4
    animation-duration-ten: 9
    broadcast-rare: true
    broadcast-threshold: 0.001
    enabled: true

    display-entity:
      enabled: true       # 是否启用展示实体（默认 true）
      scale: 0.5
      face-player: false
      floating-animation: true
      float-amplitude: 0.15
      float-speed: 1.0
      height-offset: 1.5
      glowing: false
      # glow-color: "#FFD700"  # 金色发光
      particle-effect:
        type: STAR_RING
        density: 3
        radius: 1.2
        speed: 0.3

    # 保底规则
    pity:
      enabled: true
      start: 68
      max: 100
      target-max-probability: 0.0008

    milepost-pick:
      interval: 300
      max-picks: 3

    rewards:
      - id: redstone_block_16
        item: minecraft:redstone_block
        amount: 16
        probability: 0.133
        display-name: "<red>红石块 x16"
