# =============================
# FoliaShop - 系统商店与扭蛋插件
# =============================
# 作者: FoliaShop Team
# 版本: 1.0.3
# 支持: Folia 1.20.1+
# 依赖: XConomy (经济), CraftEngine (可选，用于自定义物品), PlayerPoints (可选，用于点券)

# =============================
# 数据库设置
# =============================
database:
  # 数据库类型: mysql 或 h2
  # - h2: 本地文件数据库，适合单服务器，无需额外配置
  # - mysql: 远程数据库，适合多服务器共享数据
  type: h2

  # MySQL 设置（仅当 type 为 mysql 时有效）
  mysql:
    host: localhost
    port: 3306
    database: foliashop
    username: root
    password: password
    pool-size: 10

  # H2 设置（本地文件数据库）
  h2:
    filename: foliashop

# =============================
# 经济系统设置
# =============================
economy:
  # 是否启用经济功能（需要XConomy插件）
  enabled: true
  # 货币显示名称
  currency-name: "金币"
  # 货币显示格式
  # 可用变量: {amount} = 金额, {currency} = 货币名称
  currency-format: "{amount} {currency}"

  # 点券兑换金币设置
  exchange:
    # 是否启用兑换功能（需要 PlayerPoints 插件）
    enabled: true
    # 汇率： 1 点券可2 金币
    rate: 2.0

# =============================
# 点券系统设置 (PlayerPoints)
# =============================
# PlayerPoints 是软依赖，如未安装则点券功能不可用
# 在 shop.yml 中为物品设置 buy-points 即可使用点券购买
#
# 示例 (shop.yml):
#   items:
#     vip_item:
#       item: "minecraft:diamond"
#       buy-price: 0          # 不需要金币
#       buy-points: 100       # 需要 100 点券
#       sell-price: 0         # 不可出售（出售不返点券）
#       category: "special"
#       slot: 10
#
#     hybrid_item:
#       item: "minecraft:netherite_ingot"
#       buy-price: 1000       # 需要 1000 金币
#       buy-points: 50        # 同时需要 50 点券
#       sell-price: 0
#       category: "special"
#       slot: 11

# =============================
# GUI界面设置
# =============================
gui:
  # 界面标题
  titles:
    main-menu: "<dark_gray>主菜单"
    shop: "<green>系统商店"
    gacha: "<gold>扭蛋中心"
    gacha-animation: "<yellow>扭蛋抽奖中..."
    gacha-ten-animation: "<gold>10连抽抽奖中..."
    gacha-ten-result: "<gold>10连抽结果"
    gacha-result: "<green>抽奖结果"
    gacha-history: "<aqua>抽奖记录"
    sell-menu: "<blue>出售物品"
    globalshop: "<dark_purple>全球商店"
    globalshop-submit: "<blue>上架物品"
    globalshop-returns: "<gold>待领取物品"
    globalshop-manage: "<green>我的上架"

  # 装饰物品（界面边框和按钮）
  decoration:
    border:
      material: "minecraft:light_blue_stained_glass_pane"
      name: " "
    close:
      material: "minecraft:barrier"
      name: "<red>关闭"
    back:
      material: "minecraft:arrow"
      name: "<yellow>返回"
    next-page:
      material: "minecraft:paper"
      name: "<green>下一页 »"
    prev-page:
      material: "minecraft:paper"
      name: "<green>« 上一页"
    confirm:
      material: "minecraft:lime_wool"
      name: "<green><bold>✔ 确认"
    cancel:
      material: "minecraft:red_wool"
      name: "<red><bold>✘ 取消"

    # 通用图标
    info:
      material: "minecraft:paper"
      name: ""
    page-info:
      material: "minecraft:paper"
      name: ""
    empty:
      material: "minecraft:barrier"
      name: ""
    sell:
      material: "minecraft:gold_ingot"
      name: "<gold>出售物品"
    history:
      material: "minecraft:book"
      name: "<aqua>交易记录"
    exchange:
      material: "minecraft:sunflower"
      name: "<yellow>点券兑换"
    delete:
      material: "minecraft:tnt"
      name: "<red>删除"
    save:
      material: "minecraft:emerald_block"
      name: "<green>保存"
    reset:
      material: "minecraft:book"
      name: "<yellow>重置"

    # 主菜单
    shop:
      material: "minecraft:emerald"
      name: "<green>系统商店"
    gacha:
      material: "minecraft:nether_star"
      name: "<gold>扭蛋中心"
    globalshop:
      material: "minecraft:ender_chest"
      name: "<dark_purple>全球商店"

    # 库存编辑
    unlimited:
      material: "minecraft:nether_star"
      name: ""
    increase:
      material: "minecraft:lime_wool"
      name: ""
    decrease:
      material: "minecraft:red_wool"
      name: ""
    clear-stock:
      material: "minecraft:barrier"
      name: ""

    # 交易记录
    buy-icon:
      material: "minecraft:lime_stained_glass_pane"
      name: ""
    sell-icon:
      material: "minecraft:red_stained_glass_pane"
      name: ""
    other-icon:
      material: "minecraft:gray_stained_glass_pane"
      name: ""

    # 全球商店
    manage:
      material: "minecraft:chest"
      name: ""
    returns:
      material: "minecraft:hopper"
      name: ""
    submit:
      material: "minecraft:lime_dye"
      name: ""
    claim-all:
      material: "minecraft:gold_ingot"
      name: ""
    money:
      material: "minecraft:sunflower"
      name: ""
    item-fallback:
      material: "minecraft:chest"
      name: ""

# =============================
# 消息设置
# 支持 MiniMessage 格式:
# <color> = 颜色, <bold> = 粗体, <italic> = 斜体
# <reset> = 重置格式
# =============================
messages:
  # 前缀
  prefix: "<gold>[系统商店] <reset>"

  # 权限和命令
  no-permission: "<red>你没有权限执行此操作。"
  player-only: "<red>此命令只能由玩家执行。"
  config-reloaded: "<green>✔ 配置已重载。"

  # 商店相关
  insufficient-funds: "<red>余额不足！需要 <yellow>{cost} {currency}"
  insufficient-points: "<red>点券不足！需要 <yellow>{points} <red>点券"
  purchase-success: "<green>✔ 成功购买 <white>{item} <yellow>x{amount}<green>，花费 <yellow>{cost} {currency}"
  purchase-success-points: "<green>✔ 成功购买 <white>{item} <yellow>x{amount}<green>，花费 <yellow>{points} <green>点券"
  purchase-success-mixed: "<green>✔ 成功购买 <white>{item} <yellow>x{amount}<green>，花费 <yellow>{cost} {currency} <green>+ <yellow>{points} <green>点券"
  sell-success: "<green>✔ 成功出售 <white>{item} <yellow>x{amount}<green>，获得 <yellow>{reward} {currency}"
  sell-success-batch: "<green>✔ 成功出售 <yellow>{count}<green> 种物品共 <yellow>{total}<green> 个，获得 <yellow>{reward} {currency}"
  inventory-full: "<red>✘ 背包已满，无法购买物品！"
  shop-empty: "<red>商店暂无商品。"
  item-not-found: "<red>物品不存在：{item}"
  item-out-of-stock: "<red>✘ 物品库存不足！"

  # 扭蛋相关
  gacha-start: "<yellow>🎰 开始抽奖..."
  gacha-result: "<green>🎉 恭喜获得：<gold>{item}"
  gacha-broadcast: "<gold><bold>🎉 恭喜 {player} 从 {machine} 抽中了 {item}！<yellow>({draws})"
  gacha-cancelled: "<yellow>抽奖已取消，已退还 <gold>{amount} {currency}"

  # 系统相关
  database-error: "<red>数据库错误，请联系管理员。"
  feature-disabled: "<red>该功能已被禁用。"

  # 收集兑换相关
  collect-empty: "<red>暂无可用的收集兑换任务"
  collect-not-found: "<red>收集任务 '<yellow>{id}<red>' 不存在！"
  collect-checking: "<yellow>正在检查收集进度..."
  collect-incomplete: "<red>收集未完成！进度: <yellow>{collected}<gray>/<yellow>{required}"
  collect-claim-success: "<green>✔ 成功领取收集奖励: <yellow>{name}"
  collect-claim-fail: "<red>领取失败，条件不满足或已领取过"

# =============================
# 全球商店设置 (玩家间交易)
# =============================
globalshop:
  # 是否启用全球商店功能
  enabled: false

  # 交易税率 (0.05 = 5%, 0 = 免税)
  # 卖家收益 = 售价 * (1 - 税率)
  tax-rate: 0.05

  # 上架租期（天数），到期后物品自动下架并进入卖家待领取列表
  rental-period-days: 7

  # 每次上架的租金费用（无论上架多少个物品）
  # 0 = 免费
  listing-fee: 100.0

  # 每个玩家最大同时上架数量
  max-listings-per-player: 10

  # 过期物品保留天数（超过后自动清理数据库记录）
  expired-retain-days: 30
