# =============================
# FoliaShop - 商店配置
# =============================
# 此文件包含系统商店的所有配置
# 可以覆盖 config.yml 中的商店设置

# 是否启用商店
enabled: true

# 商店名称
title: "系统商店"

# 是否允许玩家出售物品给系统
allow-sell: true

# 出售价格折扣（玩家出售给系统的价格 = 购买价格 × 此系数）
sell-discount: 0.7

# 是否记录所有交易日志到数据库
log-transactions: true

# 商品刷新间隔（分钟，0表示不自动刷新）
refresh-interval: 0

# 玩家每日购买限制（0表示无限制）
daily-buy-limit: 0

# =============================
# 系统回收设置
# =============================
sell-system:
  # 是否启用系统回收功能（/shop sell 命令）
  enabled: true
  # 回收物品是否增加商店库存
  add-stock-on-sell: false

# =============================
# 商品分类设置
# =============================
# 支持子分类（subcategories），子分类和商品可以在同一界面混合显示
# 子分类就像一个"虚拟商品"，点击后进入下一层商品列表
#
# 子分类示例:
#   building:
#     name: "建筑材料"
#     icon: "minecraft:bricks"
#     slot: 10
#     enabled: true        # 是否启用该分类（默认 true），设为 false 则不在商店中显示
#     daily-sell-limit: 5000.0  # 每日出售金币限额（0=无限制），限制玩家每天通过系统回收出售该分类物品获得的金币总额
#     subcategories:
#       blocks:
#         name: "建筑方块"
#         icon: "minecraft:stone"
#         slot: 11          # 子分类也可以设置 slot，和商品混合排列
#       decor:
#         name: "装饰方块"
#         icon: "minecraft:flower_pot"
#         slot: 12
#
# 回收专用分类示例（不在商店显示，但物品可通过系统回收出售）:
#   sell_only:
#     name: "回收专用"
#     icon: "minecraft:hopper"
#     slot: 0
#     sell-only: true      # 设为 true 则该分类不出现在商店，但其中的物品可通过 /shop sell 回收
#
# 商品使用子分类时，category 格式为 "父分类:子分类"，如:
#   category: "building:blocks"
#
# 子分类和商品可以放在同一个分类下，通过 slot 指定位置:
#   - 点击子分类 → 进入下一层商品列表
#   - 点击商品 → 直接购买
#
categories:
  building:
    name: "建筑材料"
    icon: "minecraft:bricks"
    slot: 10
  tools:
    name: "工具装备"
    icon: "minecraft:diamond_pickaxe"
    slot: 12
  food:
    name: "食物补给"
    icon: "minecraft:cooked_beef"
    slot: 14
  minerals:
    name: "矿物资源"
    icon: "minecraft:diamond"
    slot: 16

  # ========== CraftEngine namespace 自动填充示例（默认禁用） ==========
  # 一个分类/子分类自动装满某个 CE namespace 下的全部物品，省去逐件手配。
  # auto-fill 段：物品来源（packs=namespace / tags / items / exclude，复用扭蛋语法）。
  # defaults 段：每件物品的价格/库存/限额。
  # 物品仅存内存（不写 DB）、无限库存；buy-price 支持 "min~max"（每玩家每天随机区间价）。
  # 默认 sell-price=0 = 不可回售（避免无限库存+可卖套利）。
  ce_furniture:
    name: "<aqua>家具坊"
    icon: "minecraft:chest"
    slot: 19
    enabled: false                       # 确认 namespace 正确后改 true
    auto-fill:
      packs: [furniture]                 # CE namespace（pack.yml 里声明的 namespace，不是文件夹名）
      # tags: [myserver:chair]           # 可选：用 CE tag 圈子集
      # exclude: [furniture:debug]
    defaults:
      buy-price: "100~500"              # 每日随机区间（每玩家每天固定，PriceUtil）
      # sell-price: 0                   # 默认 0 = 不可回售；如开启，务必 buy-price 下限 ≥ sell-price
      # stock: -1                       # autoFill 物品仅存内存，强制无限库存（配正数会被忽略并警告）
      # daily-limit: 0; player-limit: 0
    subcategories:
      chairs:                           # 子分类级 auto-fill：用 tag 圈子集
        name: "椅子"
        icon: "minecraft:oak_stairs"
        slot: 11
        auto-fill:
          packs: [furniture]
          tags: [furniture:chair]
        defaults:
          buy-price: "80~300"

# =============================
# 商店商品列表
# =============================
# 配置说明:
# - item: 物品ID，支持 "minecraft:xxx" 或 "ce_namespace:item_id"
# - buy-price: 购买价格（金币），0或负数表示不需要金币，支持随机范围如 50~200
# - buy-points: 购买所需点券（PlayerPoints），0表示不需要点券
# - sell-price: 出售价格（金币），0或负数表示不可出售，支持随机范围如 25~100
# - stock: 库存数量，-1表示无限库存
# - category: 所属分类ID，支持子分类格式 "parent:child"（如 "building:blocks"）
# - slot: 在分类GUI中的位置
# - daily-limit: 每日购买限额，0表示无限制（每日重置）
# - player-limit: 每个玩家终身购买限额，0表示无限制（永久累计）
# - components: 附加NBT组件（可选），格式: "path+value"
# - give-item: 是否给予物品（可选，默认true），设为false时只执行命令
# - commands: 购买后执行的命令列表（可选），在控制台执行，{player}替换为玩家名
# - conditions: 购买条件列表（可选），支持 !permission:xxx（没有权限才能买）
#
# 注意：
# 1. buy-price 和 buy-points 可以同时设置，购买时会同时扣除金币和点券
# 2. commands 可用于出售 VIP 权限、称号等非物品商品
# 3. give-item: false 时，商品只执行命令不给予物品（适合纯命令商品）
# 4. daily-limit 和 player-limit 可同时设置，玩家需要同时满足两个限制才能购买
# 5. buy-price 和 sell-price 支持随机范围语法 "最低价~最高价"（如 50~200），
#    价格对每个玩家每天固定，不同玩家/不同天价格不同
#
# NBT组件示例:
#   components:
#     # 添加附魔
#     - "minecraft:enchantments+{'minecraft:sharpness':5,'minecraft:unbreaking':3}"
#     # 设置自定义名称
#     - "minecraft:custom_name+\"§6传说之剑\""
#     # 设置Lore
#     - "minecraft:lore+[\"§7第一行描述\",\"§7第二行描述\"]"
#     # 设置自定义数据（用于插件识别）
#     - "minecraft:custom_data+{shop_item:true,rarity:'legendary'}"
#     # 设置耐久度
#     - "minecraft:damage+100"
#     # 设置自定义模型数据
#     - "minecraft:custom_model_data+1001"
#
items:
  # 建筑材料
  stone:
    item: "minecraft:stone"
    buy-price: 2.0
    sell-price: 1.0
    stock: -1
    category: "building"
    slot: 10
  cobblestone:
    item: "minecraft:cobblestone"
    buy-price: 1.0
    sell-price: 0.5
    stock: -1
    category: "building"
    slot: 11
  oak_planks:
    item: "minecraft:oak_planks"
    buy-price: 3.0
    sell-price: 1.5
    stock: -1
    category: "building"
    slot: 12
  glass:
    item: "minecraft:glass"
    buy-price: 5.0
    sell-price: 2.5
    stock: -1
    category: "building"
    slot: 13

  # 工具装备
  iron_pickaxe:
    item: "minecraft:iron_pickaxe"
    buy-price: 150.0
    sell-price: 75.0
    stock: -1
    category: "tools"
    slot: 10

  # 带NBT的示例：附魔铁剑（金币+点券混合购买）
  enchanted_iron_sword:
    item: "minecraft:iron_sword"
    buy-price: 500.0
    buy-points: 100
    sell-price: 0
    stock: -1
    category: "tools"
    slot: 11
    daily-limit: 1
    components:
      # 添加锋利5和耐久3附魔
      - "minecraft:enchantments+{'minecraft:sharpness':5,'minecraft:unbreaking':3}"
      # 设置自定义名称
      - "minecraft:custom_name+\"§6§l传说铁剑\""
      # 设置Lore
      - "minecraft:lore+[\"§7商店限定版\",\"§7每日限购1把\",\"§c需要 100 点券\"]"
      # 设置不可破坏
      - "minecraft:unbreakable+{}"
      # 设置自定义数据
      - "minecraft:custom_data+{shop_special:true,version:1b}"

  # 纯点券购买示例
  vip_token:
    item: "minecraft:emerald"
    buy-price: 0
    buy-points: 500
    sell-price: 0
    stock: -1
    category: "tools"
    slot: 13
    daily-limit: 1
    components:
      # 设置自定义名称
      - "minecraft:custom_name+\"§a§lVIP令牌\""
      # 设置Lore
      - "minecraft:lore+[\"§7使用 500 点券购买\",\"§7不可出售\"]"

  # 命令执行商品示例（VIP权限）
  vip_rank:
    item: "minecraft:diamond_block"
    buy-price: 10000
    buy-points: 1000
    sell-price: 0
    stock: 10              # 全服限量10个
    category: "tools"
    slot: 15
    daily-limit: 0         # 不限每日购买（用player-limit控制）
    player-limit: 1        # 每个玩家终身只能购买1次
    give-item: false       # 不给予物品，只执行命令
    commands:              # 购买后执行的命令（控制台执行，{player}替换为玩家名）
      - "say 恭喜 {player} 购买了VIP！"
      - "lp user {player} parent addtemp vip 30d"
    conditions:            # 购买条件
      - "!permission:group.vip"  # 已有VIP的玩家不能购买
    components:
      - "minecraft:custom_name+\"§6§lVIP特权（30天）\""
      - "minecraft:lore+[\"§7购买后自动获得VIP权限\",\"§7有效期30天\",\"§7全服限量10个\",\"§7每人限购1次\"]"

  # 混合商品示例（给物品+执行命令）
  welcome_kit:
    item: "minecraft:chest"
    buy-price: 100
    sell-price: 0
    stock: -1
    category: "tools"
    slot: 16
    give-item: true        # 给予物品
    commands:              # 同时执行命令
      - "say {player} 购买了新手礼包！"
      - "effect give {player} minecraft:regeneration 30"
    components:
      - "minecraft:custom_name+\"§a§l新手礼包\""
      - "minecraft:lore+[\"§7包含基础装备\",\"§7赠送30秒恢复效果\"]"

  iron_sword:
    item: "minecraft:iron_sword"
    buy-price: 100.0
    sell-price: 50.0
    stock: -1
    category: "tools"
    slot: 14

  # 食物补给
  cooked_beef:
    item: "minecraft:cooked_beef"
    buy-price: 10.0
    sell-price: 5.0
    stock: -1
    category: "food"
    slot: 10
  bread:
    item: "minecraft:bread"
    buy-price: 8.0
    sell-price: 4.0
    stock: -1
    category: "food"
    slot: 11

  # 矿物资源
  coal:
    item: "minecraft:coal"
    buy-price: 15.0
    sell-price: 8.0
    stock: -1
    category: "minerals"
    slot: 10
  iron_ingot:
    item: "minecraft:iron_ingot"
    buy-price: 30.0
    sell-price: 15.0
    stock: -1
    category: "minerals"
    slot: 11
  gold_ingot:
    item: "minecraft:gold_ingot"
    buy-price: 50.0
    sell-price: 25.0
    stock: -1
    category: "minerals"
    slot: 12
  diamond:
    item: "minecraft:diamond"
    buy-price: 160.0
    sell-price: 80.0
    stock: -1
    category: "minerals"
    slot: 13

  # 随机售价示例（每天对每个玩家的价格在范围内随机，但当天固定）
  emerald:
    item: "minecraft:emerald"
    buy-price: 50~200
    sell-price: 25~100
    stock: -1
    category: "minerals"
    slot: 14

# =============================
# 拆分配置（可选）
# =============================
# 你可以将分类和商品拆分到多个文件中，便于管理
# 文件名格式: shop_{name}.yml（如 shop_weapons.yml、shop_potions.yml）
# 所有 shop_*.yml 会自动加载并合并到本文件
# 参考 jar 内置的 shop_example.yml 获取拆分文件示例
#
# 每个分类和商品支持 enabled 字段:
#   enabled: true   # 启用（默认）
#   enabled: false  # 禁用，不在商店中显示但保留配置
